<title>Rural Opportunity Lab</title>
<meta name="description" content="Rural Opportunity Lab applies business thinking, research, and partnerships to create economic opportunity in rural America.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a field-guide site. Wide expanded display type over a painted Georgia landscape,
   then plain left-aligned sections on a faintly green paper, one pine-green band per page. */
:root {
  --paper: #F5F7F1;
  --surface: #EAEEE4;
  --header-bg: #E1E7D9;
  --ink: #16221C;
  --muted: #55625A;
  --line: #D2D9CC;
  --pine: #1E4636;
  --pine-text: #1E4636;
  --field: #D6A437;
  --clay: #B4532E;
  --band-bg: #1E4636;
  --band-fg: #EEF2EA;
  --band-muted: #B6C7BC;
  --btn-bg: #1E4636;
  --btn-fg: #F5F7F1;
  --pill-now: #DCEBDD;
  --pill-now-fg: #1E4636;
  --pill-next: #F4E6C1;
  --pill-next-fg: #6A4E0E;
  --pill-later: #E6E8E3;
  --pill-later-fg: #4B554F;
  /* four dimensions: tint + ink */
  /* solid = the site's own field gold, meadow green, pine and clay; bg = a lighter wash of each */
  --create-solid: #D6A437; --create-on: #16221C; --create-bg: #EDD08A; --create-fg: #6F500C;
  --support-solid: #6E8F5A; --support-on: #F5F7F1; --support-bg: #CCDABA; --support-fg: #44632F;
  --organize-solid: #C6A882; --organize-on: #2A1F14; --organize-bg: #E6D8C4; --organize-fg: #6B4D2E;
  --sustain-solid: #B4532E; --sustain-on: #FFF8F3; --sustain-bg: #E5B9A3; --sustain-fg: #8E3C20;
  /* landscape */
  --sky-top: #9CC4D9;
  --sky-low: #F3D9A0;
  --sun: #F7E7B5;
  --hill-far: #8FA48A;
  --hill-mid: #6E8F5A;
  --hill-near: #C9A548;
  --hill-front: #A9862F;
  --tree: #2F5236;
  --road: #E9DDBF;
  --house: #F7F5EE;
  --roof: #8C3B24;

  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-voice: "Newsreader", Georgia, "Times New Roman", serif;

  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.5rem;
  --step-3: clamp(1.75rem, 1.3rem + 1.6vw, 2.5rem);
  --step-4: clamp(2.25rem, 1.4rem + 3.6vw, 4.25rem);
  --max: 1180px;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1713; --surface: #16211B; --header-bg: #18241E; --ink: #E6ECE5; --muted: #9AA99F; --line: #26342C;
    --pine: #1E4636; --pine-text: #8CC4A4; --field: #E3B550; --clay: #E07B55;
    --band-bg: #142C22; --band-fg: #E6ECE5; --band-muted: #9DB5A6;
    --btn-bg: #E3B550; --btn-fg: #16221C;
    --pill-now: #1F3B2D; --pill-now-fg: #A9D9BC; --pill-next: #3A3016; --pill-next-fg: #EBCB7A; --pill-later: #232B26; --pill-later-fg: #A9B3AC;
    --create-solid: #E3B550; --create-on: #16221C; --support-solid: #8DAE76; --support-on: #16221C; --organize-solid: #B48C67; --organize-on: #16120D; --sustain-solid: #E07B55; --sustain-on: #16221C;
    --create-bg: #352B10; --create-fg: #E3B550; --support-bg: #212C1A; --support-fg: #A9C691; --organize-bg: #2E2318; --organize-fg: #C9A27E; --sustain-bg: #36211A; --sustain-fg: #E07B55;
    --sky-top: #24354A; --sky-low: #C77A4E; --sun: #F2B66B;
    --hill-far: #3B4A47; --hill-mid: #2E4433; --hill-near: #6B5A2A; --hill-front: #4F4220;
    --tree: #18281C; --road: #A8987A; --house: #D9D2C2; --roof: #6E2E1B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1713; --surface: #16211B; --header-bg: #18241E; --ink: #E6ECE5; --muted: #9AA99F; --line: #26342C;
  --pine: #1E4636; --pine-text: #8CC4A4; --field: #E3B550; --clay: #E07B55;
  --band-bg: #142C22; --band-fg: #E6ECE5; --band-muted: #9DB5A6;
  --btn-bg: #E3B550; --btn-fg: #16221C;
  --pill-now: #1F3B2D; --pill-now-fg: #A9D9BC; --pill-next: #3A3016; --pill-next-fg: #EBCB7A; --pill-later: #232B26; --pill-later-fg: #A9B3AC;
    --create-solid: #E3B550; --create-on: #16221C; --support-solid: #8DAE76; --support-on: #16221C; --organize-solid: #B48C67; --organize-on: #16120D; --sustain-solid: #E07B55; --sustain-on: #16221C;
    --create-bg: #352B10; --create-fg: #E3B550; --support-bg: #212C1A; --support-fg: #A9C691; --organize-bg: #2E2318; --organize-fg: #C9A27E; --sustain-bg: #36211A; --sustain-fg: #E07B55;
  --sky-top: #24354A; --sky-low: #C77A4E; --sun: #F2B66B;
  --hill-far: #3B4A47; --hill-mid: #2E4433; --hill-near: #6B5A2A; --hill-front: #4F4220;
  --tree: #18281C; --road: #A8987A; --house: #D9D2C2; --roof: #6E2E1B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: var(--step-0); line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--header-bg); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--field); outline-offset: 3px; border-radius: 4px; }

.wrap {
  max-width: calc(var(--max) + 64px); margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 720px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: var(--step-4); font-weight: 800; font-stretch: 118%; line-height: 1.02; }
h2 { font-size: var(--step-3); font-weight: 750; font-stretch: 112%; line-height: 1.1; }
h3 { font-size: var(--step-1); font-weight: 700; font-stretch: 105%; line-height: 1.25; }
p { margin: 0; }
.label {
  font-family: var(--f-display); font-stretch: 88%; font-weight: 650;
  font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted);
}
.voice { font-family: var(--f-voice); font-style: italic; font-weight: 400; }
.lede { font-size: var(--step-1); color: var(--muted); max-width: 40rem; }
.measure { max-width: 38rem; }
.stack { display: flex; flex-direction: column; gap: 16px; }

/* header */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--header-bg) 96%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); box-shadow: 0 6px 18px -12px color-mix(in srgb, var(--ink) 45%, transparent); }
@media (max-width: 880px) { .site-header .nav { background: var(--header-bg); } }
.site-header .wrap { display: flex; align-items: center; gap: 24px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.brand-mark { flex: none; width: 38px; height: 38px; border-radius: 9px; background: var(--pine); display: grid; place-items: center; }
.brand-mark svg { width: 26px; height: 26px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.05; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-stretch: 115%; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; }
.brand-by { font-family: var(--f-voice); font-style: italic; font-size: 0.85rem; color: var(--muted); }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: 500; font-size: 0.95rem; color: var(--muted); }
.nav a:hover { color: var(--ink); background: var(--surface); }
.nav a[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--field); border-radius: 0; }
.menu-btn { display: none; margin-left: auto; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 8px 12px; font: inherit; font-weight: 600; cursor: pointer; }
@media (max-width: 880px) {
  .site-header .btn { display: none; }
  .menu-btn { display: inline-flex; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; background: var(--paper); border-bottom: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
  .nav.open { display: flex; }
  .nav a { padding: 12px; }
}

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: 0.95rem; padding: 12px 20px; border-radius: 999px; background: var(--btn-bg); color: var(--btn-fg); border: 1px solid var(--btn-bg); white-space: nowrap; transition: transform .15s ease; }
.btn:hover { transform: translateY(-1px); }
.btn-quiet { background: transparent; color: var(--ink); border-color: var(--line); }
.band .btn { background: var(--field); border-color: var(--field); color: #16221C; }
.band .btn-quiet { background: transparent; color: var(--band-fg); border-color: color-mix(in srgb, var(--band-fg) 35%, transparent); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.text-link { align-self: flex-start; font-weight: 600; color: var(--pine-text); text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 1px; }

/* sections */
section { padding-block: clamp(56px, 8vw, 104px); }
.section-head { display: grid; gap: 16px 48px; grid-template-columns: 1fr; margin-bottom: 40px; }
@media (min-width: 860px) { .section-head { grid-template-columns: 1.1fr 1fr; align-items: end; } }
.section-head > * { min-width: 0; }
.rule { border-top: 1px solid var(--line); }
.band { background: var(--band-bg); color: var(--band-fg); }
.band .label, .band .lede, .band .muted { color: var(--band-muted); }

/* hero */
.hero { padding-block: clamp(40px, 6vw, 72px) 0; }
.hero-top { display: grid; gap: 24px; }
.hero-tags { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.hero-tags span + span::before { content: "·"; margin-right: 14px; color: var(--field); }
.hero h1 .accent { color: var(--pine-text); }
.landscape { margin-top: clamp(32px, 5vw, 56px); position: relative; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16 / 6.2; max-width: 100%; min-height: 220px; background: var(--sky-top); }
.landscape svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.landscape-note { position: absolute; left: 16px; bottom: 14px; background: color-mix(in srgb, var(--paper) 88%, transparent); color: var(--ink); padding: 6px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; backdrop-filter: blur(4px); }
@media (prefers-reduced-motion: no-preference) {
  .sun { animation: rise 2.4s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { transform: translateY(24px); } to { transform: none; } }
}

/* the three-line promise */
.promise { display: grid; gap: 4px 32px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .promise { grid-template-columns: repeat(3, 1fr); } }
.promise p { font-family: var(--f-display); font-weight: 750; font-stretch: 112%; font-size: var(--step-2); line-height: 1.15; padding-block: 18px; border-top: 2px solid var(--field); }
.promise p span { display: block; font-family: var(--f-body); font-weight: 400; font-stretch: 100%; font-size: var(--step-0); color: var(--band-muted); margin-top: 10px; line-height: 1.55; }

/* initiatives */
.initiatives { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .initiatives { grid-template-columns: 1fr 1fr; } }
.initiative { border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; display: flex; flex-direction: column; gap: 14px; background: var(--paper); min-width: 0; }
.initiative.flagship { background: var(--surface); }
.initiative-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.icon { width: 44px; height: 44px; color: var(--pine-text); }
.pill { font-family: var(--f-display); font-stretch: 90%; font-weight: 650; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.pill.now { background: var(--pill-now); color: var(--pill-now-fg); }
.pill.next { background: var(--pill-next); color: var(--pill-next-fg); }
.pill.later { background: var(--pill-later); color: var(--pill-later-fg); }
.initiative .short { color: var(--muted); }
.signature { margin-top: auto; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 0.95rem; }
.signature .label { display: block; margin-bottom: 2px; }
.signature strong { font-family: var(--f-voice); font-style: italic; font-weight: 500; font-size: 1.1rem; }

/* initiative detail (work page) */
/* each module is a slightly deeper wash of the same pine-to-field blend, so the four read as one family */
.details { display: flex; flex-direction: column; gap: 14px; }
.detail { display: grid; gap: 24px 56px; grid-template-columns: 1fr; padding: clamp(24px, 4vw, 44px); border-radius: var(--radius); background: var(--wash); }
.detail .detail-meta div, .detail .signature { border-color: color-mix(in srgb, var(--ink) 14%, transparent); }
@media (min-width: 860px) { .detail { grid-template-columns: 0.9fr 1.1fr; } }
.detail > * { min-width: 0; }
.detail-meta { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .detail-meta { grid-template-columns: 1fr 1fr; } }
.detail-meta div { border-top: 1px solid var(--line); padding-top: 10px; }
.detail-meta ul { margin: 6px 0 0; padding-left: 18px; }

/* steps */
.steps { display: grid; gap: 0; grid-template-columns: 1fr; counter-reset: s; }
@media (min-width: 900px) { .steps { grid-template-columns: repeat(5, 1fr); } }
.step { padding: 20px 20px 20px 0; border-top: 2px solid var(--field); min-width: 0; }
@media (min-width: 900px) { .step { padding-right: 24px; } }
.step .n { font-family: var(--f-display); font-stretch: 80%; font-weight: 700; font-size: 0.85rem; color: var(--field); }
.step h3 { margin: 6px 0 8px; }
.step p { color: var(--band-muted); font-size: 0.95rem; }
.band-flow { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; font-family: var(--f-voice); font-style: italic; font-size: var(--step-1); color: var(--band-muted); flex-wrap: wrap; }

/* Georgia */
.georgia { display: grid; gap: 40px; grid-template-columns: 1fr; align-items: center; }
@media (min-width: 860px) { .georgia { grid-template-columns: 1fr 1fr; } }
.georgia > * { min-width: 0; }
.county-grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; max-width: 460px; }
.county-grid i { aspect-ratio: 1; border-radius: 2px; background: var(--line); }
.county-grid i.on { background: var(--clay); }
.big { font-family: var(--f-display); font-weight: 800; font-stretch: 125%; font-size: clamp(3rem, 2rem + 4vw, 5rem); line-height: 1; color: var(--pine-text); font-variant-numeric: tabular-nums; }

/* roadmap */
.roadmap { display: grid; gap: 0; grid-template-columns: 1fr; position: relative; }
@media (min-width: 860px) { .roadmap { grid-template-columns: repeat(4, 1fr); } }
.phase { padding: 20px 24px 20px 0; border-top: 1px solid var(--line); position: relative; min-width: 0; }
.phase::before { content: ""; position: absolute; top: -6px; left: 0; width: 11px; height: 11px; border-radius: 50%; background: var(--paper); border: 2px solid var(--muted); }
.phase.current::before { background: var(--field); border-color: var(--field); }
.phase .when { font-family: var(--f-display); font-stretch: 90%; font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--pine-text); margin: 10px 0 6px; font-variant-numeric: tabular-nums; }
.phase p { color: var(--muted); }

/* framework */
/* framework: wheel + tinted dimension cards */
.system { display: grid; gap: 40px 64px; grid-template-columns: 1fr; align-items: center; margin-bottom: 48px; }
@media (min-width: 900px) { .system { grid-template-columns: 1fr 1fr; } }
.system > * { min-width: 0; }
.wheel-box { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.wheel { width: 100%; max-width: 440px; height: auto; overflow: visible; }
.wheel .seg { cursor: pointer; transition: opacity .2s ease; outline: none; }
.wheel.has-focus .seg:not(.on) { opacity: .4; }
.wheel .seg-label { font-family: var(--f-display); font-stretch: 95%; font-weight: 700; font-size: 12px; letter-spacing: .16em; fill: var(--ink); pointer-events: none; }
.wheel .tick { stroke-width: 2.5; stroke-linecap: round; }
.wheel .tick-hit { fill: transparent; cursor: pointer; }
.wheel .tick-grp.on .tick { stroke-width: 4; }
.wheel .core { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; }
.wheel .core-small { font-family: var(--f-display); font-size: 9px; letter-spacing: .18em; fill: var(--muted); }
.wheel .core-big { font-family: var(--f-display); font-weight: 750; font-stretch: 110%; font-size: 24px; fill: var(--ink); }
.wheel .core-voice { font-family: var(--f-voice); font-style: italic; font-size: 13px; fill: var(--pine-text); }
.wheel-cap { color: var(--muted); font-size: 0.95rem; max-width: 26rem; text-align: center; min-height: 3.2em; }
.wheel-cap strong { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--solid); color: var(--on); font-family: var(--f-display); font-stretch: 92%; font-weight: 700; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; padding: 7px 12px; border-radius: 999px; }
.dims { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .dims { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1040px) { .dims { grid-template-columns: repeat(4, 1fr); } }
.dim { background: var(--solid); color: var(--on); border-radius: var(--radius); padding: 26px 24px 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; transition: transform .2s ease, box-shadow .2s ease; }
.dim.on { transform: translateY(-3px); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--solid); }
.dim-top { display: flex; justify-content: space-between; align-items: center; }
.dim-num { font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: .85rem; opacity: .8; font-variant-numeric: tabular-nums; }
.dim-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--on); }
.dim h3 { font-size: var(--step-2); }
.dim .verb { font-family: var(--f-display); font-stretch: 90%; font-weight: 650; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; opacity: .8; margin-top: -8px; }
.dim p { opacity: .88; font-size: 0.95rem; }
.dim ul { list-style: none; margin: auto 0 0; padding: 12px 0 0; display: flex; flex-direction: column; }
.dim li { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; padding: 12px 0; border-top: 1px solid color-mix(in srgb, var(--on) 28%, transparent); }
.dim li span { opacity: .8; }
.dim-link { display: flex; justify-content: space-between; text-decoration: none; padding-top: 14px; border-top: 1px solid color-mix(in srgb, var(--on) 28%, transparent); font-family: var(--f-display); font-stretch: 90%; font-weight: 700; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
.dim-link:hover span { transform: translateX(3px); }
.dim-link span { transition: transform .15s ease; }
.lens { display: grid; grid-template-columns: 1fr; gap: 24px 48px; }
@media (min-width: 860px) { .lens { grid-template-columns: repeat(3, 1fr); } }
.lens div { border-top: 1px solid var(--line); padding-top: 14px; }
.lens-open div { border-top: 0; padding-top: 0; }
.lens p { color: var(--muted); margin-top: 6px; }
.chain { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }

// The Community Opportunity System wheel: one arc per dimension, one tick per pathway.
function wheel() {
  const C = 200, R1 = 106, R2 = 150, GAP = 2.2;
  const pt = (r, a) => [C + r * Math.cos(a * Math.PI / 180), C + r * Math.sin(a * Math.PI / 180)];
  const arc = (a0, a1) => {
    const [x1, y1] = pt(R2, a0), [x2, y2] = pt(R2, a1), [x3, y3] = pt(R1, a1), [x4, y4] = pt(R1, a0);
    return `M${x1} ${y1}A${R2} ${R2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${R1} ${R1} 0 0 0 ${x4} ${y4}Z`;
  };
  // Creating top-right, then clockwise: Supporting, Organizing, Sustaining.
  const parts = SITE.dimensions.map((d, i) => {
    const a0 = -90 + i * 90 + GAP, a1 = a0 + 90 - 2 * GAP, mid = (a0 + a1) / 2;
    // Label curves along the middle of the band; bottom segments run the other way so text stays upright.
    const RL = (R1 + R2) / 2, bottom = mid > 0 && mid < 180;
    const [sx, sy] = pt(RL, bottom ? a1 : a0), [ex, ey] = pt(RL, bottom ? a0 : a1);
    const labelPath = `<path id="lp${i}" d="M${sx} ${sy}A${RL} ${RL} 0 0 ${bottom ? 0 : 1} ${ex} ${ey}" fill="none"/>`;
    const n = d.pathways.length;
    const ticks = d.pathways.map((p, j) => {
      const a = a0 + (a1 - a0) * (j + 1) / (n + 1);
      const [x1, y1] = pt(R2 + 10, a), [x2, y2] = pt(R2 + 22, a), [hx, hy] = pt(R2 + 16, a);
      return `<g class="tick-grp" data-dim="${i}" data-path="${esc(p)}" tabindex="0" role="button" aria-label="${esc(p)} pathway">
        <circle class="tick-hit" cx="${hx}" cy="${hy}" r="13"/><line class="tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--${d.color}-solid)"/></g>`;
    }).join("");
    return `<g class="seg" data-dim="${i}" tabindex="0" role="button" aria-label="${d.name}: ${esc(d.copy)}">
      <path d="${arc(a0, a1)}" fill="var(--${d.color}-solid)"/></g>
      ${labelPath}<text class="seg-label" style="fill:var(--${d.color}-on)" dominant-baseline="middle"><textPath href="#lp${i}" startOffset="50%" text-anchor="middle">${d.name.toUpperCase()}</textPath></text>${ticks}`;
  }).join("");
  return `<svg class="wheel" viewBox="0 0 400 400" aria-label="The Community Opportunity System: four dimensions and ten pathways around community opportunity">
    ${parts}
    <circle class="core" cx="${C}" cy="${C}" r="92"/>
    <text class="core-small" x="${C}" y="${C - 22}" text-anchor="middle">COMMUNITY</text>
    <text class="core-big" x="${C}" y="${C + 8}" text-anchor="middle">Opportunity</text>
    <text class="core-voice" x="${C}" y="${C + 32}" text-anchor="middle">a system, not a program</text>
  </svg>`;
}
const WHEEL_HINT = "Hover a segment to read its dimension. Tap a tick to name a pathway.";

function setupWheel() {
  const svg = document.querySelector(".wheel"), cap = document.getElementById("wheel-cap");
  if (!svg) return;
  const cards = [...document.querySelectorAll("[data-card]")];
  const show = (i, path) => {
    svg.classList.add("has-focus");
    svg.querySelectorAll(".seg").forEach(s => s.classList.toggle("on", s.dataset.dim == i));
    svg.querySelectorAll(".tick-grp").forEach(t => t.classList.toggle("on", t.dataset.path === path));
    cards.forEach(c => c.classList.toggle("on", c.dataset.card == i));
    const d = SITE.dimensions[i];
    cap.innerHTML = path ? `<strong>${esc(path)}</strong> is a pathway in <strong>${d.name}</strong>.`
                         : `<strong>${d.name}</strong> · ${esc(d.copy)}`;
  };
  const clear = () => {
    svg.classList.remove("has-focus");
    svg.querySelectorAll(".on").forEach(e => e.classList.remove("on"));
    cards.forEach(c => c.classList.remove("on"));
    cap.textContent = WHEEL_HINT;
  };
  svg.querySelectorAll(".seg").forEach(s => {
    s.addEventListener("mouseenter", () => show(s.dataset.dim));
    s.addEventListener("focus", () => show(s.dataset.dim));
    s.addEventListener("click", () => show(s.dataset.dim));
  });
  svg.querySelectorAll(".tick-grp").forEach(t => {
    const go = () => show(t.dataset.dim, t.dataset.path);
    t.addEventListener("mouseenter", go); t.addEventListener("focus", go); t.addEventListener("click", go);
  });
  svg.addEventListener("mouseleave", clear);
}

/* ==========================================================================
   ROUTER — #home, #work, #approach, #about (#partner jumps to contact)
   ========================================================================== */
function render() {
  const key = (location.hash || "#home").slice(1);
  const page = PAGES[key] ? key : "home";
  const active = page === "partner" ? "about" : page === "framework" ? "approach" : page;
  document.getElementById("site").innerHTML = header(active) + PAGES[page]() + footer();
  const btn = document.getElementById("menu-btn"), nav = document.getElementById("nav");
  btn.addEventListener("click", () => { const open = nav.classList.toggle("open"); btn.setAttribute("aria-expanded", open); });
  setupWheel();
  if (page === "partner") document.getElementById("contact")?.scrollIntoView();
  else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();
